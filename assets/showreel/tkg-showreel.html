const TX = 118, TY = 560, TAG_Y = 650;          // left-third text block
const T_LOCK = 9.6, T_XF0 = 10.2, T_XF1 = 11.2;  // wordmark lock, crossfade to hero frame

// ---------- helpers ----------
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const lerp = (a,b,u) => a + (b-a)*u;
const seg = (t,a,b) => clamp((t-a)/(b-a));
const eIO = u => u<.5 ? 4*u*u*u : 1 - Math.pow(-2*u+2,3)/2;
const eOut = u => 1 - Math.pow(1-u,3);
const eIn = u => u*u*u;
const gold = a => `rgba(242,182,50,${a})`;
const pale = a => `rgba(255,226,150,${a})`;

// Hero composition: egg right-of-centre (~67% across), matching the reference frame.
const CX = 1290, CY = 520;
const EGG_RX = 90, EGG_RY = 118;
const R = rng(20260928);

// crack
const crack = [];
{ let x = 8, y = -EGG_RY + 6; crack.push([x,y]);
  for (let i = 0; i < 16; i++) { x += (R()-.5)*26; y += 11 + R()*6; x = clamp(x, -60, 60); crack.push([x,y]); } }
const branches = [[4,[[18,-8],[34,-2],[46,6]]],[9,[[-16,4],[-30,14]]],[12,[[20,10],[28,24],[40,30]]]];

// shards
const shards = [];
for (let i = 0; i < 280; i++) {
  const a = R()*Math.PI*2, s = Math.sqrt(R());
  const px = Math.cos(a)*EGG_RX*s, py = Math.sin(a)*EGG_RY*s;
  const dir = Math.atan2(py, px) + (R()-.5)*.6, sp = 300 + R()*1100;
  const size = 3 + Math.pow(R(),2)*24, pts = [];
  for (let k = 0; k < 3 + (R()<.4); k++) { const aa = k/3*Math.PI*2 + R()*1.2; pts.push([Math.cos(aa)*size*(.4+R()*.8), Math.sin(aa)*size*(.4+R()*.8)]); }
  shards.push({px,py,vx:Math.cos(dir)*sp,vy:Math.sin(dir)*sp*.85,rot:R()*6,vr:(R()-.5)*5,pts,edge:.3+R()*.7,drag:1.1+R()*1.2,
    glass:R()<.35, delay:R()*.35});
}
// dust
const dust = [];
for (let i = 0; i < 1500; i++) {
  const a = R()*Math.PI*2, sp = 60 + Math.pow(R(),.7)*1300;
  dust.push({vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*.8,drag:.8+R()*1.4,sz:.6+R()*2.4,tw:R()*6.28,tf:2+R()*6,delay:R()*.4});
}
// rings
const rings = [];
for (let i = 0; i < 7; i++) {
  const pts = [], n = 150;
  const ph = [R()*6.28, R()*6.28, R()*6.28, R()*6.28], ox = (R()-.5)*300, oy = (R()-.5)*200;
  for (let k = 0; k < n; k++) { const a = k/n*Math.PI*2;
    const r = 260 + 170*Math.sin(3*a+ph[0]) + 110*Math.sin(5*a+ph[1]) + 60*Math.sin(8*a+ph[2]);
    const a2 = a + .6*Math.sin(2*a+ph[3]);
    pts.push([ox + Math.cos(a2)*r*1.3, oy + Math.sin(a2)*r*.8]); }
  rings.push({r:150 + i*58, tilt:(R()-.5)*2.2, yaw:R()*Math.PI, spd:(.35+R()*.45)*(i%2?1:-1), chaos:pts, n, delay:i*.1});
}
const nodes = [];
for (let i = 0; i < 46; i++) { const u = R()*2-1, th = R()*Math.PI*2, s = Math.sqrt(1-u*u), r = 250 + R()*170;
  nodes.push({x:s*Math.cos(th)*r, y:u*r, z:s*Math.sin(th)*r, cx:(R()-.5)*1400, cy:(R()-.5)*900}); }
const links = [];
for (let i = 0; i < nodes.length; i++) {
  const d = nodes.map((n,j) => [j, (n.x-nodes[i].x)**2+(n.y-nodes[i].y)**2+(n.z-nodes[i].z)**2]).sort((a,b)=>a[1]-b[1]);
  for (let k = 1; k <= 2; k++) if (d[k][0] > i) links.push([i, d[k][0]]);
}
// embers over the hero frame
const embers = [];
for (let i = 0; i < 260; i++) {
  const near = R() < .7;
  embers.push({x: near ? CX + (R()-.5)*900 : R()*W, y: near ? CY + (R()-.5)*700 : R()*H,
    vx:(R()-.5)*16, vy:-5-R()*18, sz:.7+R()*2.2, ph:R()*6.28, fl:1+R()*3, t0:9.8+R()*2.5, life:3+R()*4});
}
// smoke wisps (pre-rendered soft blobs)
const smoke = [];
function makeSmoke(){
  for (let i = 0; i < 6; i++) {
    const c = document.createElement('canvas'); c.width = 900; c.height = 500; const g = c.getContext('2d');
    for (let k = 0; k < 40; k++) {
      const x = 150 + R()*600, y = 120 + R()*260, r = 40 + R()*140;
      const rg = g.createRadialGradient(x,y,0,x,y,r);
      rg.addColorStop(0, `rgba(70,90,140,${.03 + R()*.04})`); rg.addColorStop(1, 'rgba(70,90,140,0)');
      g.fillStyle = rg; g.fillRect(0,0,900,500);
    }
    smoke.push({c, x:R()*W, y:200 + R()*(H-400), vx:(R()-.5)*30, rot:(R()-.5)*.6, s:1 + R()*1.2, a:.5 + R()*.5});
  }
}

// wordmark target points (sampled from an offscreen render)
let textPts = [];
function sampleText(){
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.textBaseline = 'alphabetic';
  g.font = WORD_FONT; g.fillText(WORD, TX, TY);
  g.font = TAG_FONT; g.fillText(TAG, TX + 6, TAG_Y);
  const d = g.getImageData(0,0,W,H).data, pts = [];
  for (let y = 0; y < H; y += 5) for (let x = 0; x < 900; x += 5) if (d[(y*W+x)*4+3] > 128) pts.push([x,y]);
  const r = rng(7);
  for (let i = pts.length-1; i > 0; i--) { const j = Math.floor(r()*(i+1)); [pts[i],pts[j]] = [pts[j],pts[i]]; }
  textPts = pts;
}

// ---------- camera ----------
function camera(t){
  let z;
  if (t < 3) z = lerp(2.5, 3.1, eIO(t/3));
  else if (t < 6) z = lerp(3.1, 1.2, eOut(seg(t,3,5.6)));
  else if (t < 9) z = lerp(1.2, 1.55, eIO(seg(t,6,9)));        // orbit + push in
  else z = lerp(1.55, 1.0, eIO(seg(t,9,T_XF1)));
  const yaw = t < 6 ? 0 : (t-6)*.42;
  let sx = 0, sy = 0;
  const shake = (t0, dur, amp) => { if (t > t0 && t < t0+dur) { const k = (1 - seg(t,t0,t0+dur))*amp; sx += Math.sin(t*93)*k; sy += Math.cos(t*71)*k; } };
  shake(3, .7, 22); shake(T_LOCK, .45, 12);
  return {z, yaw, sx, sy};
}
function proj(x,y,z,cam){
  const c = Math.cos(cam.yaw), s = Math.sin(cam.yaw);
  const xr = x*c + z*s, zr = -x*s + z*c;
  const p = 1400/(1400 + zr);
  return [CX + cam.sx + xr*p*cam.z, CY + cam.sy + y*p*cam.z, p];
}
function burstPos(px,py,vx,vy,drag,dt){ const f = (1-Math.exp(-drag*dt))/drag; return [px+vx*f, py+vy*f]; }

// ---------- effects ----------
function flare(x, y, k, streak = 1){
  if (k <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  // anamorphic streak
  ctx.translate(x,y); ctx.scale(1, .035);
  let g = ctx.createRadialGradient(0,0,0,0,0,900*streak);
  g.addColorStop(0, `rgba(255,236,190,${.55*k})`); g.addColorStop(.3, gold(.18*k)); g.addColorStop(1, gold(0));
  ctx.fillStyle = g; ctx.fillRect(-900*streak,-900*streak,1800*streak,1800*streak);
  ctx.restore(); ctx.save(); ctx.globalCompositeOperation = 'lighter';
  // bloom
  g = ctx.createRadialGradient(x,y,0,x,y,260);
  g.addColorStop(0, `rgba(255,245,220,${.5*k})`); g.addColorStop(.25, gold(.2*k)); g.addColorStop(1, gold(0));
  ctx.fillStyle = g; ctx.fillRect(x-260,y-260,520,520);
  // ghosts along the axis through frame centre
  const dx = W/2 - x, dy = H/2 - y;
  for (const [f, r, a, col] of [[.5,40,.10,'255,200,120'],[.9,18,.16,'255,230,180'],[1.35,70,.04,'150,160,210'],[1.8,28,.1,'255,190,90']]) {
    const gx = x + dx*f*2, gy = y + dy*f*2;
    const gg = ctx.createRadialGradient(gx,gy,0,gx,gy,r);
    gg.addColorStop(0, `rgba(${col},${a*k})`); gg.addColorStop(.7, `rgba(${col},${a*k*.5})`); gg.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(gx,gy,r,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function shockwave(x, y, t, t0, maxR, strength){
  const u = seg(t, t0, t0 + 1.1); if (u <= 0 || u >= 1) return;
  const r = eOut(u)*maxR, a = (1-u)*strength;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [w, al] of [[40,.06],[14,.18],[3,.7]]) {
    ctx.strokeStyle = pale(a*al); ctx.lineWidth = w*(1-u*.5);
    ctx.beginPath(); ctx.ellipse(x, y, r, r*.82, 0, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}
function drawSmoke(t, alpha){
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const s of smoke) {
    ctx.save(); ctx.globalAlpha = s.a*alpha;
    ctx.translate(((s.x + s.vx*t) % (W+900) + W+900) % (W+900) - 450, s.y + Math.sin(t*.2 + s.rot*10)*30);
    ctx.rotate(s.rot + t*.01); ctx.scale(s.s, s.s);
    ctx.drawImage(s.c, -450, -250); ctx.restore();
  }
  ctx.restore();
}
function drawWordmark(t){
  const u = seg(t, T_LOCK, T_LOCK + .18);
  if (u <= 0) return;
  const sc = lerp(1.07, 1, eOut(u));
  ctx.save();
  ctx.translate(TX, TY); ctx.scale(sc, sc); ctx.translate(-TX, -TY);
  ctx.font = WORD_FONT; ctx.textBaseline = 'alphabetic';
  const g = ctx.createLinearGradient(0, TY-190, 0, TY);
  g.addColorStop(0, '#ffd77a'); g.addColorStop(.55, '#f2b632'); g.addColorStop(1, '#c98a14');
  ctx.shadowColor = gold(.55); ctx.shadowBlur = 36;
  ctx.fillStyle = g; ctx.globalAlpha = u; ctx.fillText(WORD, TX, TY);
  ctx.shadowBlur = 0;
  // flash on lock
  const fl = Math.exp(-(t - T_LOCK)*7);
  if (fl > .01) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,245,220,${fl*.9})`; ctx.fillText(WORD, TX, TY); }
  // travelling specular sweep across letters
  const sw = seg(t, T_LOCK + .1, T_LOCK + 1.1);
  if (sw > 0 && sw < 1) {
    ctx.globalCompositeOperation = 'lighter';
    const sx = lerp(TX - 200, TX + 700, sw);
    const sg = ctx.createLinearGradient(sx-80, 0, sx+80, 0);
    sg.addColorStop(0,'rgba(255,255,255,0)'); sg.addColorStop(.5,'rgba(255,255,240,.55)'); sg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = sg; ctx.fillText(WORD, TX, TY);
  }
  ctx.restore();
  // tagline
  const v = eOut(seg(t, T_LOCK + .3, T_LOCK + .75));
  if (v > 0) {
    ctx.save(); ctx.font = TAG_FONT; ctx.fillStyle = `rgba(247,238,220,${v})`;
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 12;
    ctx.fillText(TAG, TX + 6, TAG_Y + (1-v)*14);
    ctx.restore();
  }
}
function drawHero(t, a){
  if (a <= 0 || !hero.naturalWidth) return;
  const s = lerp(1.08, 1.0, eOut(seg(t, T_XF0, 13))) ;           // settle, then hold still
  const iw = W*s, ih = iw*hero.naturalHeight/hero.naturalWidth;
  const ox = CX - (CX)*s, oy = (H - ih)/2;
  ctx.save(); ctx.globalAlpha = a; ctx.drawImage(hero, ox, oy, iw, ih); ctx.restore();
}

// ---------- render ----------
function draw(t){
  const cam = camera(t);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, 1400);
  bg.addColorStop(0, '#0e1a3c'); bg.addColorStop(.55, '#070e24'); bg.addColorStop(1, '#03060f');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  drawSmoke(t, .9);

  const toText = eIn(seg(t, 9.0, T_LOCK));         // particles fly into the wordmark
  const conv = eIn(seg(t, 9.0, 9.9));               // threads collapse into the orb
  const burstT = Math.max(0, t - 3);
  const slow = t < 3 ? 0 : (burstT < 3 ? burstT*.6 : 1.8 + (burstT-3)*.3);

  // --- egg ---
  if (t < 3.1) {
    ctx.save(); ctx.translate(CX+cam.sx, CY+cam.sy); ctx.scale(cam.z, cam.z);
    const shell = ctx.createRadialGradient(-30,-50,5, 0,0,EGG_RY*1.1);
    shell.addColorStop(0,'#3a3f4d'); shell.addColorStop(.3,'#10131b'); shell.addColorStop(1,'#010103');
    ctx.fillStyle = shell; ctx.beginPath(); ctx.ellipse(0,0,EGG_RX,EGG_RY,0,0,Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = pale(.12); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.ellipse(0,0,EGG_RX,EGG_RY,0,-.3,1.6); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.ellipse(0,0,EGG_RX-1.5,EGG_RY-1.5,0,0,Math.PI*2); ctx.clip();   // keep the crack on the shell
    const grow = eOut(seg(t, 0, 2.9)), pulse = .8 + .2*Math.sin(t*11) + .6*seg(t,2.4,3);
    const n = Math.max(2, Math.floor(crack.length * (.35 + .65*grow)));
    for (const [w,a] of [[10,.08],[4,.3],[1.2,1]]) {
      ctx.strokeStyle = pale(a*pulse*(.5+.5*grow)); ctx.lineWidth = w; ctx.lineJoin = 'round';
      ctx.beginPath(); crack.slice(0,n).forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke();
      for (const [at, pts] of branches) if (at < n) {
        const bu = seg(t, 1.2+at*.08, 2.9); if (bu <= 0) continue;
        ctx.beginPath(); ctx.moveTo(...crack[at]);
        pts.slice(0, Math.ceil(pts.length*bu)).forEach(([x,y]) => ctx.lineTo(crack[at][0]+x, crack[at][1]+y)); ctx.stroke();
      }
    }
    const glow = ctx.createRadialGradient(crack[8][0],crack[8][1],0,crack[8][0],crack[8][1],110);
    glow.addColorStop(0, gold(.28*grow*pulse)); glow.addColorStop(1, gold(0));
    ctx.fillStyle = glow; ctx.fillRect(-160,-190,320,380);
    ctx.restore();
    ctx.restore();
    flare(CX + (crack[8][0])*cam.z, CY + crack[8][1]*cam.z, .25*grow*pulse, .6);
  }

  ctx.globalCompositeOperation = 'lighter';

  // --- shatter flash + shockwave ---
  if (t >= 3 && t < 4.3) {
    const f = Math.pow(1 - seg(t,3,4.3), 2.2);
    const g = ctx.createRadialGradient(CX,CY,0,CX,CY,1000*f+200);
    g.addColorStop(0, `rgba(255,240,200,${f})`); g.addColorStop(.3, gold(.4*f)); g.addColorStop(1, gold(0));
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    flare(CX, CY, f, 1.4);
  }
  shockwave(CX, CY, t, 3.0, 1300, 1);
  shockwave(CX, CY, t, 3.25, 900, .5);

  // --- gold dust ---
  if (t >= 3 && t < T_LOCK + .05) {
    for (let i = 0; i < dust.length; i++) {
      const d = dust[i];
      let [x,y] = burstPos(0,0,d.vx,d.vy,d.drag,slow);
      x += Math.sin(t*.6 + d.tw)*12; y += Math.cos(t*.5 + d.tw)*10;
      let [sx,sy,p] = proj(x,y,0,cam);
      const k = clamp((toText - d.delay*.3)/(1 - d.delay*.3));
      if (k > 0 && textPts.length) { const tp = textPts[i % textPts.length]; sx = lerp(sx, tp[0], eIn(k)); sy = lerp(sy, tp[1], eIn(k)); }
      const tw = .45 + .55*Math.pow(Math.max(0, Math.sin(t*d.tf + d.tw)), 3);
      const a = tw * (t < 3.3 ? seg(t,3,3.3) : 1) * (1 + k);
      const s = d.sz*p*cam.z*.8;
      ctx.fillStyle = gold(a*.85); ctx.fillRect(sx-s/2, sy-s/2, s, s);
      if (d.sz > 2.4) { ctx.fillStyle = gold(a*.12); ctx.fillRect(sx-s*2, sy-s*2, s*4, s*4); }
    }
  }

  // --- glass shards ---
  if (t >= 3 && t < T_LOCK + .05) {
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < shards.length; i++) {
      const s = shards[i];
      let [x,y] = burstPos(s.px,s.py,s.vx,s.vy,s.drag,slow);
      let [sx,sy,p] = proj(x,y,0,cam);
      const k = clamp((toText - s.delay)/(1 - s.delay));
      if (k > 0 && textPts.length) { const tp = textPts[(i*37) % textPts.length]; sx = lerp(sx, tp[0], eIn(k)); sy = lerp(sy, tp[1], eIn(k)); }
      const sc = p*cam.z*(1 - .85*k), rot = s.rot + s.vr*slow + k*4;
      ctx.save(); ctx.translate(sx,sy); ctx.rotate(rot); ctx.scale(sc,sc);
      ctx.beginPath(); s.pts.forEach(([px,py],j)=> j?ctx.lineTo(px,py):ctx.moveTo(px,py)); ctx.closePath();
      ctx.fillStyle = s.glass ? 'rgba(200,215,240,.16)' : 'rgba(12,16,30,.9)'; ctx.fill();
      const lit = .35 + .65*Math.pow(Math.max(0, Math.sin(rot*2 + t)), 4);
      ctx.strokeStyle = s.glass ? `rgba(240,245,255,${.7*lit})` : pale(s.edge*lit); ctx.lineWidth = 1.2/sc; ctx.stroke();
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'lighter';
  }

  // --- threads: chaos -> orbital rings, swirling and tightening ---
  if (t >= 5.6 && t < 10) {
    const vis = seg(t,5.6,6.3) * (1 - seg(t,9.5,10));
    const tighten = 1 - .35*eIO(seg(t,7,9));
    for (const ring of rings) {
      const m = eIO(seg(t, 6 + ring.delay, 8 + ring.delay));
      const rr = ring.r * tighten * (1 - conv*.97);
      const ct = Math.cos(ring.tilt), st = Math.sin(ring.tilt), cy = Math.cos(ring.yaw), sy = Math.sin(ring.yaw);
      const spin = t*ring.spd*(1 + seg(t,7,9));
      ctx.beginPath();
      for (let k = 0; k <= ring.n; k++) {
        const i = k % ring.n, a = i/ring.n*Math.PI*2 + spin;
        let x = Math.cos(a)*rr, y = 0, z = Math.sin(a)*rr;
        [y, z] = [y*ct - z*st, y*st + z*ct];
        [x, z] = [x*cy + z*sy, -x*sy + z*cy];
        const ch = ring.chaos[i], wob = (1-m)*30*Math.sin(t*2 + i);
        const X = lerp(ch[0]*(1-conv)+wob, x, m), Y = lerp(ch[1]*(1-conv)+wob, y, m), Z = z*m;
        const [px,py] = proj(X,Y,Z,cam);
        k ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
      }
      const bright = .3 + .5*m + .6*conv;
      ctx.strokeStyle = gold(.09*vis*bright); ctx.lineWidth = 6; ctx.stroke();
      ctx.strokeStyle = pale(.6*vis*bright); ctx.lineWidth = 1.2; ctx.stroke();
    }
    const m = eIO(seg(t, 6.5, 8.5));
    const P = nodes.map(n => proj(lerp(n.cx, n.x, m)*tighten*(1-conv), lerp(n.cy, n.y, m)*tighten*(1-conv), n.z*m*tighten*(1-conv), cam));
    ctx.lineWidth = .8;
    for (const [a,b] of links) { ctx.strokeStyle = gold(.3*m*vis); ctx.beginPath(); ctx.moveTo(P[a][0],P[a][1]); ctx.lineTo(P[b][0],P[b][1]); ctx.stroke(); }
    for (const [x,y,p] of P) { ctx.fillStyle = pale(.9*vis*(.3+.7*m)); ctx.beginPath(); ctx.arc(x,y,2.2*p,0,Math.PI*2); ctx.fill(); }
  }

  // --- central orb: grows and pulses on the beat 6-10s ---
  if (t >= 5.8 && t < T_XF1) {
    const beat = 60/BPM, bp = t >= 6 ? Math.exp(-((t-6) % beat)*6) : 0;
    const g = eOut(seg(t, 5.8, 9.2)) * (1 - seg(t, T_XF0, T_XF1));
    const r = (8 + 32*g) * (1 + .12*bp) * cam.z;
    const halo = ctx.createRadialGradient(CX,CY,0,CX,CY,r*8);
    halo.addColorStop(0, `rgba(255,240,200,${.6*g})`); halo.addColorStop(.15, gold(.35*g)); halo.addColorStop(.45, gold(.08*g)); halo.addColorStop(1, gold(0));
    ctx.fillStyle = halo; ctx.fillRect(CX-r*8, CY-r*8, r*16, r*16);
    ctx.save(); ctx.translate(CX,CY); ctx.rotate(t*.1);
    for (let i = 0; i < 40; i++) { const a = i/40*Math.PI*2, L = r*(2.5 + 2.5*((i*7)%5)/5)*(1+bp*.4);
      ctx.strokeStyle = pale(.22*g); ctx.lineWidth = i%3 ? .6 : 1.3;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*r*1.1, Math.sin(a)*r*1.1); ctx.lineTo(Math.cos(a)*L, Math.sin(a)*L); ctx.stroke(); }
    ctx.restore();
    const core = ctx.createRadialGradient(CX,CY,0,CX,CY,r);
    core.addColorStop(0,'rgba(255,255,245,1)'); core.addColorStop(.5,'rgba(255,228,160,.95)'); core.addColorStop(1, gold(0));
    ctx.fillStyle = core; ctx.beginPath(); ctx.arc(CX,CY,r,0,Math.PI*2); ctx.fill();
    flare(CX, CY, g*(.55 + .45*bp), 1 + g*.6);
  }

  // --- crossfade to hero frame ---
  ctx.globalCompositeOperation = 'source-over';
  drawHero(t, eIO(seg(t, T_XF0, T_XF1)));
  if (t > T_XF0) {
    ctx.globalAlpha = eIO(seg(t, T_XF0, T_XF1)); drawSmoke(t, .35); ctx.globalAlpha = 1;
    // gentle living glow on the hero core
    const hk = eIO(seg(t, T_XF0, T_XF1)) * (.25 + .08*Math.sin(t*2.2));
    flare(1288, 508, hk, .9);
  }

  // --- text lock: shockwave + flare burst at the wordmark ---
  const tcx = TX + 280, tcy = TY - 90;
  shockwave(tcx, tcy, t, T_LOCK, 900, .9);
  if (t >= T_LOCK) flare(tcx, tcy, Math.exp(-(t-T_LOCK)*3.5)*1.1, 1.3);

  // --- left-third darkening so the type sits on clean negative space ---
  ctx.globalCompositeOperation = 'source-over';
  const lk = .3 + .5*seg(t, 9, 10.5);
  const left = ctx.createLinearGradient(0,0,W*.5,0);
  left.addColorStop(0, `rgba(3,6,16,${lk})`); left.addColorStop(.75, `rgba(3,6,16,${lk*.45})`); left.addColorStop(1, 'rgba(3,6,16,0)');
  ctx.fillStyle = left; ctx.fillRect(0,0,W*.5,H);

  drawWordmark(t);

  // --- embers drifting ---
  if (t >= 9.8) {
    ctx.globalCompositeOperation = 'lighter';
    for (const e of embers) {
      if (t < e.t0) continue;
      const dt = t - e.t0, a = Math.min(1, dt*1.2) * Math.max(0, 1 - dt/e.life) * (.6 + .4*Math.sin(t*e.fl + e.ph));
      const x = e.x + e.vx*dt + Math.sin(dt*1.1 + e.ph)*10, y = e.y + e.vy*dt;
      ctx.fillStyle = gold(a*.9); ctx.fillRect(x, y, e.sz, e.sz);
      ctx.fillStyle = gold(a*.12); ctx.fillRect(x-e.sz*1.5, y-e.sz*1.5, e.sz*4, e.sz*4);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  const vg = ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*1.05);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  const fade = 1 - seg(t,0,.6);
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0,0,W,H); }
}

// ---------- sound design ----------
function buildAudio(ac, out){
  const T0 = ac.currentTime + .15;
  const master = ac.createGain(); master.gain.value = .5;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 4;
  const post = ac.createGain(); post.gain.value = .6; master.connect(comp); comp.connect(post); post.connect(out);
  const mkIR = (sec, decay) => { const b = ac.createBuffer(2, ac.sampleRate*sec, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1)*Math.pow(1 - i/d.length, decay); } return b; };
  const verb = ac.createConvolver(); verb.buffer = mkIR(5, 2.5); const vg = ac.createGain(); vg.gain.value = .5; verb.connect(vg); vg.connect(master);
  const noise = (() => { const b = ac.createBuffer(1, ac.sampleRate*3, ac.sampleRate), d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; })();
  const env = (g, at, peak, a, hold, rel) => { g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(peak, at+a); g.gain.setValueAtTime(peak, at+a+hold); g.gain.exponentialRampToValueAtTime(.0001, at+a+hold+rel); };
  const osc = (type, f, at, end, dest) => { const o = ac.createOscillator(); o.type = type; o.frequency.value = f; o.connect(dest); o.start(at); o.stop(end); return o; };
  const send = (node, amt) => { const s = ac.createGain(); s.gain.value = amt; node.connect(s); s.connect(verb); };
  const noiseHit = (at, type, f, peak, rel, rev = 0, q = 1) => { const n = ac.createBufferSource(); n.buffer = noise; const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = ac.createGain(); env(g, at, peak, .002, .01, rel); n.connect(fl); fl.connect(g); g.connect(master); if (rev) send(g, rev); n.start(at, Math.random()*2); n.stop(at + rel + .1); };
  const boom = (at, f0, f1, peak, rel) => { const g = ac.createGain(); env(g, at, peak, .004, .05, rel); g.connect(master);
    const o = osc('sine', f0, at, at+rel+.2, g); o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at+rel*.8); };
  const sweep = (t0, t1, f0, f1, peak) => { const n = ac.createBufferSource(); n.buffer = noise; n.loop = true; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2;
    bp.frequency.setValueAtTime(f0, t0); bp.frequency.exponentialRampToValueAtTime(f1, t1);
    const g = ac.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(peak, t1 - .02); g.gain.linearRampToValueAtTime(0, t1 + .05);
    n.connect(bp); bp.connect(g); g.connect(master); send(g, .4); n.start(t0); n.stop(t1 + .2); };

  // 0-3: sub drone + rising strings
  const drone = ac.createGain(); drone.connect(master);
  drone.gain.setValueAtTime(0, T0); drone.gain.linearRampToValueAtTime(.4, T0+2.5); drone.gain.linearRampToValueAtTime(.12, T0+6); drone.gain.linearRampToValueAtTime(0, T0+9);
  osc('sine', 41, T0, T0+9.5, drone); osc('sine', 55, T0, T0+9.5, drone).detune.value = 6;
  const str = ac.createGain(), sf = ac.createBiquadFilter(); sf.type = 'lowpass';
  sf.frequency.setValueAtTime(300, T0); sf.frequency.exponentialRampToValueAtTime(3000, T0+3);
  str.gain.setValueAtTime(0, T0); str.gain.linearRampToValueAtTime(.13, T0+2.97); str.gain.linearRampToValueAtTime(0, T0+3.03);
  sf.connect(str); str.connect(master); send(str, .6);
  for (const f of [110, 164.8, 220, 261.6, 329.6, 440]) for (const dt of [-9, 8]) osc('sawtooth', f, T0, T0+3.2, sf).detune.value = dt;
  sweep(T0+1.8, T0+3, 400, 6000, .12);

  // 3.0: huge glass shatter + bass impact + rising whoosh
  const S = T0 + 3;
  noiseHit(S, 'highpass', 2500, 1, 1.2, .6);
  noiseHit(S, 'bandpass', 5000, .6, .4, .3, 3);
  for (let i = 0; i < 40; i++) { const at = S + Math.pow(Math.random(),2)*1.4, g = ac.createGain(); env(g, at, .05 + Math.random()*.07, .001, 0, .15 + Math.random()*.5);
    g.connect(master); send(g, .8); osc('sine', 2500 + Math.random()*7000, at, at+.8, g); }
  boom(S, 95, 26, 1, 2.2);
  noiseHit(S, 'lowpass', 180, .7, 1.5);
  sweep(S+.6, T0+6, 200, 4000, .16);

  // 6-11: driving hybrid beat @98 BPM
  const beat = 60/BPM, B0 = T0 + 6, L = T0 + T_LOCK;
  for (let i = 0; T0 + 6 + i*beat < T0 + 11; i++) {
    const at = B0 + i*beat, late = at >= L;
    if (at > L - .25 && at < L + .1) continue;            // leave room for the lock hit
    boom(at, 130, 45, late ? .9 : .8, .32);
    for (const h of [0, .5]) noiseHit(at + h*beat, 'highpass', 8000, .1, .05);
    if (i % 2 === 1) noiseHit(at, 'bandpass', 1900, .38, .18, .4);
    const bg = ac.createGain(); env(bg, at, .2, .01, beat*.4, .2); const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 450;
    bg.connect(lp); lp.connect(master); osc('sawtooth', [55,55,65.4,49][Math.floor(i/2)%4], at, at+beat, bg);
  }
  const pent = [1318.5, 1568, 1760, 2093, 2349, 2637, 3136];
  for (let i = 0; i < 20; i++) { const at = B0 + i*.15 + Math.random()*.05, g = ac.createGain();
    env(g, at, .07, .002, 0, 1.2); g.connect(master); send(g, 1); const f = pent[Math.floor(Math.random()*pent.length)];
    osc('sine', f, at, at+1.4, g); osc('triangle', f*2.01, at, at+.6, g); }
  // brass swell toward the lock
  const br = ac.createGain(), bf = ac.createBiquadFilter(); bf.type = 'lowpass';
  bf.frequency.setValueAtTime(250, T0+7); bf.frequency.exponentialRampToValueAtTime(3500, L - .02);
  br.gain.setValueAtTime(0, T0+7); br.gain.linearRampToValueAtTime(.17, L - .02); br.gain.linearRampToValueAtTime(0, L + .06);
  bf.connect(br); br.connect(master); send(br, .5);
  for (const f of [87.3, 130.8, 174.6, 220, 261.6]) for (const dt of [-6, 5]) osc('sawtooth', f, T0+7, L + .1, bf).detune.value = dt;
  sweep(L - 1, L, 300, 9000, .22);                       // riser into the hit

  // 9.6: punchy lock hit
  boom(L, 120, 38, 1, 1.1);
  noiseHit(L, 'bandpass', 2200, .8, .3, .7, .8);
  noiseHit(L, 'highpass', 5000, .4, .5, .6);

  // 11.0: final rich chord with long shimmer tail, fading to silence by 15s
  const F = T0 + 11;
  boom(F, 90, 34, .7, 1.8);
  const ch = ac.createGain(); ch.connect(master); send(ch, 1.3);
  ch.gain.setValueAtTime(0, F); ch.gain.linearRampToValueAtTime(.2, F+.04); ch.gain.setTargetAtTime(.0001, F+.4, 1.1);
  for (const f of [65.4, 98, 130.8, 196, 246.9, 329.6, 392, 523.3]) { osc('triangle', f, F, T0+15, ch); osc('sine', f*2, F, T0+15, ch); }
  const sh = ac.createGain(); sh.connect(master); send(sh, 1.5);
  sh.gain.setValueAtTime(0, F); sh.gain.linearRampToValueAtTime(.05, F+.8); sh.gain.setTargetAtTime(.0001, F+1.5, 1);
  for (const f of [1568, 1975.5, 2349, 3136]) { const o = osc('sine', f, F, T0+15, sh); }
  return T0;
}

// ---------- playback / recording ----------
let ac = null, t0 = 0, raf = 0, onFinish = null;
function loop(){
  const t = Math.min(DUR, ac.currentTime - t0);
  draw(Math.max(0, t)); statusEl.textContent = `${Math.max(0,t).toFixed(2)} / 15.00s`;
  if (t < DUR) raf = requestAnimationFrame(loop); else { cancelAnimationFrame(raf); if (onFinish) onFinish(); }
}
function start(withStream){
  cancelAnimationFrame(raf); if (ac) ac.close();
  ac = new AudioContext({sampleRate: 48000});
  const out = withStream ? ac.createMediaStreamDestination() : null;
  const mix = ac.createGain(); mix.connect(ac.destination); if (out) mix.connect(out);
  t0 = buildAudio(ac, mix); loop();
  return out;
}
const btns = [...document.querySelectorAll('button')];
document.getElementById('play').onclick = () => { onFinish = null; start(false); };
document.getElementById('rec').onclick = () => {
  btns.forEach(b => b.disabled = true);
  const out = start(true);
  const stream = new MediaStream([...cv.captureStream(FPS).getVideoTracks(), ...out.stream.getAudioTracks()]);
  const type = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const mr = new MediaRecorder(stream, {mimeType:type, videoBitsPerSecond: 20e6}); const chunks = [];
  mr.ondataavailable = e => e.data.size && chunks.push(e.data);
  mr.onstop = () => { save(new Blob(chunks,{type:'video/webm'}), 'TKG_showreel_1920x1080_24fps.webm'); btns.forEach(b => b.disabled = false); statusEl.textContent = '保存しました'; };
  mr.start();
  onFinish = () => setTimeout(() => mr.stop(), 300);
};
document.getElementById('png').onclick = () => { draw(14.5); cv.toBlob(b => save(b, 'TKG_hero_1920x1080.png')); };
function save(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }

window.renderFrame = draw; // frame-by-frame preview
Promise.all([document.fonts.load(WORD_FONT, WORD), document.fonts.load(TAG_FONT, TAG),
  hero.decode ? hero.decode().catch(()=>{}) : Promise.resolve()]).catch(()=>{}).then(() => {
  makeSmoke(); sampleText(); draw(1.2);
  btns.forEach(b => b.disabled = false); statusEl.textContent = '▶ で再生'; window.ready = true;
});
})();
</script>
